# Inventaire des 6 postes + du serveur central.
# Adapter les IP, et le brochage GPIO si votre câblage diffère du défaut
# documenté dans docs/hardware.md.

all:
  children:
    rotary_phones:
      hosts:
        phone01:
          ansible_host: 192.168.1.101
          phone_id: phone01
          sip_extension: "100"
          gpio_hook: 17
          gpio_dial_pulse: 27
          gpio_dial_off_normal: 22
          gpio_ringer_output: 23
