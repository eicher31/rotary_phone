---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ phone_id }}"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-venv
      - git
      - alsa-utils
    state: present
