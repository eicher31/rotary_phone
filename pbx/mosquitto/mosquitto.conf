# Config Mosquitto pour le bus d'événements/commandes des 6 postes.
# À placer dans /etc/mosquitto/conf.d/rotary-phones.conf sur le serveur
# central. Voir docs/setup.md pour la création des comptes.

listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd

# Pour la régie de jeu (Node-RED / tableau de bord dans un navigateur) :
listener 9001
protocol websockets
allow_anonymous false
password_file /etc/mosquitto/passwd
