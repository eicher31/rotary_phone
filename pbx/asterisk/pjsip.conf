; Configuration PJSIP minimale pour 6 postes téléphoniques rotatifs
; (extensions internes 100-105).
;
; ATTENTION : changer tous les mots de passe "changeme-*" avant toute
; utilisation réelle. Cette config n'a pas pu être testée contre un
; serveur Asterisk réel dans cet environnement — voir docs/README.md.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Décommenter et ajuster si Asterisk est derrière un NAT :
; external_media_address=203.0.113.1
; external_signaling_address=203.0.113.1
; local_net=192.168.1.0/24

[phone-template](!)
type=endpoint
context=internal
disallow=all
allow=ulaw,alaw,opus
direct_media=no

[100]
type=endpoint
context=internal
disallow=all
allow=ulaw,alaw,opus
auth=100
aors=100

[100]
type=auth
auth_type=userpass
username=100
password=changeme-100

[100]
type=aor
max_contacts=1

