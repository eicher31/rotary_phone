; Plan de numérotation minimal pour les 6 postes rotatifs.
; Voir docs/README.md pour l'état de validation de cette config
; (non testée contre un serveur Asterisk réel dans cet environnement).

[internal]
; Appel direct d'un poste à un autre (extensions 100 à 105).
exten => _10[0-5],1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()

; Sonne les 6 postes en même temps (ex. "appel du QG" pendant un scénario).
exten => 199,1,Dial(PJSIP/100&PJSIP/101&PJSIP/102&PJSIP/103&PJSIP/104&PJSIP/105,20)
 same => n,Hangup()

; Extension "régie" : point d'entrée pour que Node-RED déclenche une
; annonce préenregistrée via l'AMI (originate vers 999).
exten => 999,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Hangup()
